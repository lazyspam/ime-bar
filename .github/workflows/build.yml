name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.IMEBAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "IMEBAR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "::error::IMEBAR_KEYSTORE_BASE64 is not set; refusing to release a debug-signed APK"
            exit 1
          else
            echo "::warning::no release key; the APK is debug-signed (testing only)"
          fi

      - name: Tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          [ "v$name" = "$GITHUB_REF_NAME" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts"
            exit 1
          }

      - name: Build
        env:
          IMEBAR_KEYSTORE_PASSWORD: ${{ secrets.IMEBAR_KEYSTORE_PASSWORD }}
          IMEBAR_KEY_ALIAS: ${{ secrets.IMEBAR_KEY_ALIAS }}
          IMEBAR_KEY_PASSWORD: ${{ secrets.IMEBAR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: ImeBar-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
